name: Build Main Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen produccion
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/cotrafasocial/autogestiones:main
          build-args: |
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=6LenewktAAAAAGHB8KY8BR4ysAvUP-d-MgSczPaP
            NEXT_PUBLIC_APP_URL=https://autosolicitudes.cotrafasocial.com
          cache-from: type=gha
          cache-to: type=gha,mode=max